
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Quiz | Test Your Knowledge</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="quiz-container">
    <header class="quiz-header">
      <div class="logo">CQ</div>
      <p class="eyebrow">LEARN • THINK • GROW</p>
      <h1>Code Quiz</h1>
      <p class="subtitle">Test your computer science knowledge.</p>
    </header>

    <section id="quiz-screen" class="quiz-card">
      <div class="progress-info">
        <span id="question-progress">Question 1 of 5</span>
        <span id="score-display">Score: 0</span>
      </div>

      <div class="progress-track">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <h2 id="question">Loading question...</h2>

      <div id="options" class="options"></div>

      <p id="feedback" class="feedback" aria-live="polite"></p>

      <button id="next-button" class="primary-button" disabled>
        Check Answer
      </button>
    </section>

    <section id="result-screen" class="quiz-card result-card" hidden>
      <div class="result-icon">🏆</div>
      <p class="eyebrow">QUIZ COMPLETED</p>
      <h2>Your Results</h2>
      <p id="final-score" class="final-score">0 / 5</p>
      <p id="result-message"></p>
      <button id="restart-button" class="primary-button">
        Restart Quiz ↻
      </button>
    </section>

    <footer>
      <p>Keep learning. Every question makes you better.</p>
    </footer>
  </main>
</body>
</html>
